services:
  mongodb:
    image: mongo:8.2
    container_name: expense-management-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: expense-management
    ports:
      - "27017:27017"
    volumes:
      - .data/mongodb:/data/db
