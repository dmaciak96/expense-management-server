spring:
  application:
    name: expense-management-server
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${DB_URI}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties.mail.smtp.auth: true
    properties.mail.smtp.starttls.enable: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expirationInSeconds: ${JWT_TOKEN_EXPIRATION_IN_SECONDS}
